<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <link rel="shortcut icon" href="/static/icons/favicon.ico">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <title>Регистрация</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ВИДЕО ФОН */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--gray);
            font-size: 0.95em;
        }

        .header p a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .header p a:hover {
            color: var(--secondary);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 18px 15px 45px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .input-wrapper input.valid {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .input-wrapper input.invalid {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            transition: all 0.3s;
            font-size: 1.1em;
            z-index: 1;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            z-index: 1;
            background: none;
            border: none;
            padding: 5px;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .input-icon.active {
            color: var(--primary);
        }

        .char-counter {
            text-align: right;
            font-size: 0.75em;
            color: var(--gray);
            margin-top: 5px;
        }

        .char-counter.warning {
            color: var(--warning);
        }

        .char-counter.danger {
            color: var(--danger);
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }

        .password-strength-bar.weak {
            width: 33.33%;
            background: var(--danger);
        }

        .password-strength-bar.medium {
            width: 66.66%;
            background: var(--warning);
        }

        .password-strength-bar.strong {
            width: 100%;
            background: var(--success);
        }

        .password-hint {
            font-size: 0.8em;
            color: var(--gray);
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .password-match {
            font-size: 0.85em;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .match-success {
            color: var(--success);
        }

        .match-error {
            color: var(--danger);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .register-btn:hover::before {
            width: 500px;
            height: 500px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: var(--danger);
            padding: 15px 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 5px solid var(--danger);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        .toast-notification.error {
            background: var(--danger);
        }

        .toast-notification.success {
            background: var(--success);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================
           МОБИЛЬНАЯ АДАПТАЦИЯ
           ======================================== */
        
        @media (max-width: 768px) {
            body {
                padding: 16px;
                align-items: center;
                min-height: 100vh;
            }
            
            .register-card {
                padding: 24px 20px;
                max-width: 100%;
                border-radius: 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .header p {
                font-size: 0.85em;
            }
            
            .form-group {
                margin-bottom: 16px;
            }
            
            .input-wrapper input {
                padding: 12px 16px 12px 42px;
                font-size: 16px;
            }
            
            .input-icon {
                font-size: 14px;
                left: 14px;
            }
            
            .toggle-password {
                right: 12px;
            }
            
            .register-btn {
                padding: 14px;
                font-size: 1em;
            }
            
            .char-counter {
                font-size: 0.7em;
            }
            
            .password-hint, .password-match {
                font-size: 0.75em;
            }
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 20px 16px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .input-wrapper input {
                padding: 11px 14px 11px 38px;
            }
            
            .input-icon {
                font-size: 12px;
                left: 12px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- ВИДЕО ФОН -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="{{ url_for('static', filename='videos/17.mp4') }}" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="register-card">
        <div class="header">
            <h1>Регистрация</h1>
            <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
        </div>
        
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="post" id="registerForm">
            <!-- Логин -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon" id="userIcon"></i>
                    <input type="text" name="username" id="username" placeholder="Логин" required autofocus>
                </div>
                <div class="char-counter" id="usernameCounter">
                    <span id="usernameCount">0</span>/20
                </div>
            </div>

            <!-- ФИО -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-id-card input-icon" id="nameIcon"></i>
                    <input type="text" name="full_name" id="full_name" placeholder="ФИО полностью" required>
                </div>
                <div class="char-counter" id="fullnameCounter">
                    <span id="fullnameCount">0</span>/50
                </div>
            </div>
            
            <!-- Пароль -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon" id="passwordIcon"></i>
                    <input type="password" name="password" id="password" placeholder="Пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)" title="Показать/скрыть пароль">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrength"></div>
                </div>
                <div class="password-hint" id="passwordHint">
                    <i class="fas fa-info-circle"></i>
                    <span>Введите пароль</span>
                </div>
            </div>
            
            <!-- Подтверждение пароля -->
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon" id="confirmIcon"></i>
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Подтвердите пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)" title="Показать/скрыть пароль">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <div class="password-match" id="passwordMatch">
                    <i class="fas fa-info-circle"></i>
                    <span>Повторите пароль</span>
                </div>
            </div>
            
            <button type="submit" class="register-btn" id="submitBtn">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <script>
        // Замедляем видео для эстетики
        const video = document.querySelector('.video-background');
        if (video) {
            video.playbackRate = 0.8;
        }

        const usernameInput = document.getElementById('username');
        const fullnameInput = document.getElementById('full_name');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        const usernameCount = document.getElementById('usernameCount');
        const fullnameCount = document.getElementById('fullnameCount');

        function showToast(message, type = 'error') {
            const oldToast = document.querySelector('.toast-notification');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            let icon = type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : 
                       '<i class="fas fa-check-circle"></i>';
            toast.innerHTML = `${icon} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateCharCounter(input, counterSpan, maxLength) {
            const length = input.value.length;
            counterSpan.textContent = length;
            
            if (length >= maxLength - 2 && length < maxLength) {
                counterSpan.parentElement.classList.add('warning');
                counterSpan.parentElement.classList.remove('danger');
            } else if (length >= maxLength) {
                counterSpan.parentElement.classList.add('danger');
                counterSpan.parentElement.classList.remove('warning');
            } else {
                counterSpan.parentElement.classList.remove('warning', 'danger');
            }
        }

        function validateUsername() {
            const value = usernameInput.value.trim();
            const maxLength = 20;
            
            if (value.length === 0) {
                usernameInput.classList.remove('valid', 'invalid');
                document.getElementById('userIcon').classList.remove('active');
                return false;
            }
            
            if (value.length < 3) {
                usernameInput.classList.add('invalid');
                usernameInput.classList.remove('valid');
                document.getElementById('userIcon').classList.add('active');
                return false;
            }
            
            if (value.length > maxLength) {
                usernameInput.classList.add('invalid');
                usernameInput.classList.remove('valid');
                return false;
            }
            
            usernameInput.classList.add('valid');
            usernameInput.classList.remove('invalid');
            document.getElementById('userIcon').classList.add('active');
            return true;
        }

        function validateFullname() {
            const value = fullnameInput.value.trim();
            const maxLength = 50;
            
            if (value.length === 0) {
                fullnameInput.classList.remove('valid', 'invalid');
                document.getElementById('nameIcon').classList.remove('active');
                return false;
            }
            
            if (value.length < 2) {
                fullnameInput.classList.add('invalid');
                fullnameInput.classList.remove('valid');
                document.getElementById('nameIcon').classList.add('active');
                return false;
            }
            
            if (value.length > maxLength) {
                fullnameInput.classList.add('invalid');
                fullnameInput.classList.remove('valid');
                return false;
            }
            
            fullnameInput.classList.add('valid');
            fullnameInput.classList.remove('invalid');
            document.getElementById('nameIcon').classList.add('active');
            return true;
        }

        function checkPasswordStrength() {
            const password = passwordInput.value;
            const strengthBar = document.getElementById('passwordStrength');
            const hint = document.getElementById('passwordHint');
            
            let strength = 0;
            if (password.length >= 4) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (password.length === 0) {
                strengthBar.style.width = '0';
                hint.innerHTML = '<i class="fas fa-info-circle"></i> <span>Введите пароль</span>';
            } else if (strength <= 1) {
                strengthBar.classList.add('weak');
                hint.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i> <span style="color: var(--danger);">Слабый пароль</span>';
            } else if (strength <= 3) {
                strengthBar.classList.add('medium');
                hint.innerHTML = '<i class="fas fa-check-circle" style="color: var(--warning);"></i> <span style="color: var(--warning);">Средний пароль</span>';
            } else {
                strengthBar.classList.add('strong');
                hint.innerHTML = '<i class="fas fa-check-circle" style="color: var(--success);"></i> <span style="color: var(--success);">Надёжный пароль</span>';
            }
        }

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (confirm.length === 0) {
                matchDiv.innerHTML = '<i class="fas fa-info-circle"></i> <span>Повторите пароль</span>';
                confirmInput.classList.remove('valid', 'invalid');
                document.getElementById('confirmIcon').classList.remove('active');
            } else if (password === confirm) {
                matchDiv.innerHTML = '<i class="fas fa-check-circle match-success"></i> <span class="match-success">Пароли совпадают ✓</span>';
                confirmInput.classList.add('valid');
                confirmInput.classList.remove('invalid');
                document.getElementById('confirmIcon').classList.add('active');
            } else {
                matchDiv.innerHTML = '<i class="fas fa-exclamation-circle match-error"></i> <span class="match-error">Пароли не совпадают ✗</span>';
                confirmInput.classList.add('invalid');
                confirmInput.classList.remove('valid');
                document.getElementById('confirmIcon').classList.add('active');
            }
        }

        function validatePassword() {
            const value = passwordInput.value;
            
            if (value.length === 0) {
                passwordInput.classList.remove('valid', 'invalid');
                document.getElementById('passwordIcon').classList.remove('active');
                return false;
            }
            
            if (value.length < 4) {
                passwordInput.classList.add('invalid');
                passwordInput.classList.remove('valid');
                document.getElementById('passwordIcon').classList.add('active');
                return false;
            }
            
            passwordInput.classList.add('valid');
            passwordInput.classList.remove('invalid');
            document.getElementById('passwordIcon').classList.add('active');
            return true;
        }

        function updateButtonState() {
            const isUsernameValid = validateUsername();
            const isFullnameValid = validateFullname();
            const isPasswordValid = validatePassword();
            const isPasswordMatch = passwordInput.value === confirmInput.value && confirmInput.value.length > 0;
            
            submitBtn.disabled = !(isUsernameValid && isFullnameValid && isPasswordValid && isPasswordMatch);
        }

        // События для полей
        usernameInput.addEventListener('input', function() {
            const maxLength = 20;
            if (this.value.length > maxLength) {
                this.value = this.value.slice(0, maxLength);
            }
            updateCharCounter(this, usernameCount, maxLength);
            validateUsername();
            updateButtonState();
        });

        fullnameInput.addEventListener('input', function() {
            const maxLength = 50;
            if (this.value.length > maxLength) {
                this.value = this.value.slice(0, maxLength);
            }
            updateCharCounter(this, fullnameCount, maxLength);
            validateFullname();
            updateButtonState();
        });

        passwordInput.addEventListener('input', function() {
            checkPasswordStrength();
            validatePassword();
            checkPasswordMatch();
            updateButtonState();
        });

        confirmInput.addEventListener('input', function() {
            checkPasswordMatch();
            updateButtonState();
        });

        // Инициализация счетчиков
        updateCharCounter(usernameInput, usernameCount, 20);
        updateCharCounter(fullnameInput, fullnameCount, 50);
        checkPasswordStrength();

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Валидация перед отправкой
        registerForm.addEventListener('submit', function(e) {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            const username = usernameInput.value.trim();
            const fullName = fullnameInput.value.trim();
            
            if (!username) {
                e.preventDefault();
                showToast('Введите логин', 'error');
                return false;
            }
            
            if (username.length < 3) {
                e.preventDefault();
                showToast('Логин должен быть не менее 3 символов', 'error');
                return false;
            }
            
            if (!fullName) {
                e.preventDefault();
                showToast('Введите ФИО', 'error');
                return false;
            }
            
            if (fullName.length < 2) {
                e.preventDefault();
                showToast('ФИО должно быть не менее 2 символов', 'error');
                return false;
            }
            
            if (!password) {
                e.preventDefault();
                showToast('Введите пароль', 'error');
                return false;
            }
            
            if (password.length < 4) {
                e.preventDefault();
                showToast('Пароль должен быть не менее 4 символов', 'error');
                return false;
            }
            
            if (password !== confirm) {
                e.preventDefault();
                showToast('Пароли не совпадают', 'error');
                return false;
            }
            
            document.getElementById('loading').classList.add('active');
        });

        // Подсказка о двойном клике для вставки
        confirmInput.addEventListener('dblclick', function(e) {
            e.preventDefault();
            navigator.clipboard.readText().then(function(text) {
                confirmInput.value = text;
                checkPasswordMatch();
                updateButtonState();
                showToast('Пароль вставлен', 'success');
            }).catch(function(err) {
                showToast('Не удалось вставить', 'error');
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                    console.log('✅ Service Worker зарегистрирован!', reg.scope);
                }).catch(function(err) {
                    console.log('❌ Ошибка регистрации SW:', err);
                });
            });
        }
    </script>
</body>
</html>
