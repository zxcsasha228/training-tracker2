<!-- Активная тренировка - плашка внизу -->
<div class="active-workout-banner" id="activeWorkoutBanner" style="display: none;">
    <div class="banner-content">
        <div class="banner-left">
            <div class="banner-icon">
                <i class="fas fa-play-circle"></i>
            </div>
            <div class="banner-info">
                <div class="banner-title" id="activeWorkoutName">Тренировка</div>
                <div class="banner-timer" id="activeWorkoutTimer">00:00</div>
            </div>
        </div>
        <div class="banner-right">
            <a href="#" id="continueWorkoutBtn" class="banner-btn">
                <i class="fas fa-arrow-right"></i> Продолжить
            </a>
        </div>
    </div>
</div>

<style>
    .active-workout-banner {
        position: fixed;
        bottom: 20px;
        left: 300px;
        right: 20px;
        z-index: 9999;
        display: none;
        pointer-events: none;
        transition: left 0.3s ease;
    }
    
    .active-workout-banner.hidden {
        opacity: 0;
        pointer-events: none;
    }

    body:has(.sidebar.collapsed) .active-workout-banner {
        left: 100px;
    }

    .banner-content {
        max-width: 800px;
        margin: 0 auto;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 60px;
        padding: 12px 20px;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        pointer-events: none;
    }

    .banner-left {
        display: flex;
        align-items: center;
        gap: 15px;
        pointer-events: none;
    }

    .banner-icon {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        pointer-events: none;
    }

    .banner-info {
        display: flex;
        flex-direction: column;
        pointer-events: none;
    }

    .banner-title {
        font-weight: 600;
        font-size: 1em;
        opacity: 0.9;
        pointer-events: none;
    }

    .banner-timer {
        font-size: 1.3em;
        font-weight: bold;
        font-family: monospace;
        letter-spacing: 2px;
        pointer-events: none;
    }

    .banner-right {
        display: flex;
        align-items: center;
        pointer-events: auto;
    }

    .banner-btn {
        background: white;
        color: #10b981;
        border: none;
        padding: 10px 25px;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        pointer-events: auto;
    }

    .banner-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
    }

    .banner-btn i {
        font-size: 0.9em;
    }

    @media (min-width: 769px) {
        .main-content {
            padding-bottom: 100px !important;
        }
    }

    @media (max-width: 768px) {
        .active-workout-banner {
            left: 20px !important;
            right: 20px;
            bottom: 15px;
        }
        
        .banner-content {
            padding: 10px 15px;
        }
        
        .banner-icon {
            width: 32px;
            height: 32px;
            font-size: 1em;
        }
        
        .banner-title {
            font-size: 0.8em;
        }
        
        .banner-timer {
            font-size: 1em;
        }
        
        .banner-btn {
            padding: 6px 12px;
            font-size: 0.8em;
        }
    }

    @media (min-width: 768px) and (max-width: 1024px) {
        .active-workout-banner {
            left: 100px;
        }
        body:has(.sidebar.collapsed) .active-workout-banner {
            left: 100px;
        }
    }

    @media (max-width: 768px) {
        .modal.active {
            z-index: 10000;
        }
        
        .modal.active ~ .active-workout-banner,
        body:has(.modal.active) .active-workout-banner {
            display: none !important;
            visibility: hidden;
            opacity: 0;
        }
    }
</style>

<script>
    // ========================================
    // ПЕРЕМЕННЫЕ БАННЕРА
    // ========================================
    let bannerSeconds = 0;
    let bannerTimerInterval = null;
    let currentWorkoutId = null;
    let currentUserId = null;

    // Форматирование времени
    function formatBannerTime(secs) {
        const mins = Math.floor(secs / 60);
        const remainingSecs = secs % 60;
        return `${mins.toString().padStart(2, '0')}:${remainingSecs.toString().padStart(2, '0')}`;
    }

    // Обновление отображения на баннере
    function updateBannerDisplay() {
        const bannerTimer = document.getElementById('activeWorkoutTimer');
        if (bannerTimer) {
            bannerTimer.textContent = formatBannerTime(bannerSeconds);
        }
    }

    function startBannerTimer(initialSeconds) {
    if (bannerTimerInterval) clearInterval(bannerTimerInterval);
    
    bannerSeconds = initialSeconds;
    updateBannerDisplay();
    
    bannerTimerInterval = setInterval(() => {
        if (currentUserId && currentWorkoutId) {
            bannerSeconds++;
            updateBannerDisplay();
            // ЭТОТ КЛЮЧ ДОЛЖЕН БЫТЬ ТОЧНО ТАКИМ ЖЕ, КАК В ТРЕНИРОВКЕ
            localStorage.setItem(`workout_${currentUserId}_${currentWorkoutId}_timer`, bannerSeconds.toString());
            console.log('🏷️ Баннер тикает и пишет в storage:', bannerSeconds);
        }
    }, 1000);
}

    function stopBannerTimer() {
        if (bannerTimerInterval) {
            clearInterval(bannerTimerInterval);
            bannerTimerInterval = null;
        }
    }

    // Получить активную тренировку из localStorage
    function getActiveWorkout() {
        const userIdEl = document.getElementById('userId');
        const uid = userIdEl ? userIdEl.value : null;
        if (!uid) return null;
        
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(`workout_${uid}_`) && key.endsWith('_active')) {
                const isActive = localStorage.getItem(key) === 'true';
                if (isActive) {
                    const workoutId = key.replace(`workout_${uid}_`, '').replace('_active', '');
                    const workoutData = localStorage.getItem(`workout_${uid}_${workoutId}`);
                    const timerData = localStorage.getItem(`workout_${uid}_${workoutId}_timer`);
                    if (workoutData) {
                        try {
                            return {
                                id: workoutId,
                                data: JSON.parse(workoutData),
                                timer: timerData ? parseInt(timerData) : 0
                            };
                        } catch(e) {
                            console.error('Ошибка парсинга workoutData:', e);
                        }
                    }
                }
            }
        }
        return null;
    }

    // Обновить баннер (показать/скрыть, запустить/остановить таймер)
    function updateActiveWorkoutBanner() {
        const banner = document.getElementById('activeWorkoutBanner');
        if (!banner) return;
        
        // На странице активной тренировки баннер не нужен
        if (window.location.pathname.includes('/start') || 
            window.location.pathname.includes('/continue')) {
            banner.style.display = 'none';
            return;
        }
        
        const active = getActiveWorkout();
        
        if (active && active.data) {
            const workoutName = document.getElementById('activeWorkoutName');
            const continueBtn = document.getElementById('continueWorkoutBtn');
            
            if (workoutName) workoutName.textContent = active.data.name || 'Активная тренировка';
            if (continueBtn) continueBtn.href = `/workout/${active.id}/continue`;
            banner.style.display = 'block';
            
            // Если тренировка сменилась — перезапускаем таймер баннера
            if (currentWorkoutId !== active.id) {
                currentWorkoutId = active.id;
                currentUserId = document.getElementById('userId')?.value;
                stopBannerTimer();
                startBannerTimer(active.timer);
                console.log('🏷️ Баннер: запущен таймер для тренировки', active.id, 'время:', active.timer);
            } else if (!bannerTimerInterval) {
                // Если таймер остановился, но тренировка активна — перезапускаем
                startBannerTimer(active.timer);
            }
        } else {
            banner.style.display = 'none';
            stopBannerTimer();
            currentWorkoutId = null;
        }
    }

    // Синхронизация с тренировкой (при возврате на страницу)
    function syncWithWorkout() {
        if (currentUserId && currentWorkoutId) {
            const saved = localStorage.getItem(`workout_${currentUserId}_${currentWorkoutId}_timer`);
            if (saved !== null) {
                const newSeconds = parseInt(saved);
                if (Math.abs(bannerSeconds - newSeconds) > 2) {
                    console.log('🔄 Баннер: синхронизация с тренировкой', bannerSeconds, '->', newSeconds);
                    bannerSeconds = newSeconds;
                    updateBannerDisplay();
                }
            }
        }
    }

    // ========================================
    // ИНИЦИАЛИЗАЦИЯ
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
        updateActiveWorkoutBanner();
        
        // Синхронизация каждые 3 секунды
        setInterval(syncWithWorkout, 3000);
    });

    window.addEventListener('pageshow', updateActiveWorkoutBanner);
    window.addEventListener('focus', updateActiveWorkoutBanner);
    
    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
            setTimeout(updateActiveWorkoutBanner, 200);
        });
    });
</script>
