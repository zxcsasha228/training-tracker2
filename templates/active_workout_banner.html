<!-- Активная тренировка - плашка внизу -->
<div class="active-workout-banner" id="activeWorkoutBanner" style="display: none;">
    <div class="banner-content">
        <div class="banner-left">
            <div class="banner-icon">
                <i class="fas fa-play-circle"></i>
            </div>
            <div class="banner-info">
                <div class="banner-title" id="activeWorkoutName">Тренировка</div>
                <div class="banner-timer" id="activeWorkoutTimer">00:00</div>
            </div>
        </div>
        <div class="banner-right">
            <a href="#" id="continueWorkoutBtn" class="banner-btn">
                <i class="fas fa-arrow-right"></i> Продолжить
            </a>
        </div>
    </div>
</div>

<style>
    .active-workout-banner {
        position: fixed;
        bottom: 20px;
        left: 300px;
        right: 20px;
        z-index: 9999;
        display: none;
        pointer-events: none;
        transition: left 0.3s ease;
        
    }
    .active-workout-banner {
    transition: opacity 0.2s ease;
}
    .active-workout-banner.hidden {
    opacity: 0;
    pointer-events: none;
}

    body:has(.sidebar.collapsed) .active-workout-banner {
        left: 100px;
    }

    .banner-content {
        max-width: 800px;
        margin: 0 auto;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 60px;
        padding: 12px 20px;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        pointer-events: none;
    }

    .banner-left {
        display: flex;
        align-items: center;
        gap: 15px;
        pointer-events: none;
    }

    .banner-icon {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        pointer-events: none;
    }

    .banner-info {
        display: flex;
        flex-direction: column;
        pointer-events: none;
    }

    .banner-title {
        font-weight: 600;
        font-size: 1em;
        opacity: 0.9;
        pointer-events: none;
    }

    .banner-timer {
        font-size: 1.3em;
        font-weight: bold;
        font-family: monospace;
        letter-spacing: 2px;
        pointer-events: none;
    }

    .banner-right {
        display: flex;
        align-items: center;
        pointer-events: auto;
    }

    .banner-btn {
        background: white;
        color: #10b981;
        border: none;
        padding: 10px 25px;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        pointer-events: auto;
    }

    .banner-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
    }

    .banner-btn i {
        font-size: 0.9em;
    }
    /* Компьютеры */
@media (min-width: 769px) {
    /* Отступ снизу для всех страниц, чтобы баннер не перекрывал контент */
    .main-content {
        padding-bottom: 100px !important;
    }
}

    /* ========================================
       МОБИЛЬНАЯ АДАПТАЦИЯ
       ======================================== */
    @media (max-width: 768px) {
        .active-workout-banner {
            left: 20px !important;
            right: 20px;
            bottom: 15px;
        }
        
        .banner-content {
            padding: 10px 15px;
        }
        
        .banner-icon {
            width: 32px;
            height: 32px;
            font-size: 1em;
        }
        
        .banner-title {
            font-size: 0.8em;
        }
        
        .banner-timer {
            font-size: 1em;
        }
        
        .banner-btn {
            padding: 6px 12px;
            font-size: 0.8em;
        }
        
        
    }

    /* Планшеты */
    @media (min-width: 768px) and (max-width: 1024px) {
        .active-workout-banner {
            left: 100px;
        }
        body:has(.sidebar.collapsed) .active-workout-banner {
            left: 100px;
        }
    }
    @media (max-width: 768px) {
    /* При открытой модалке скрываем баннер */
    .modal.active {
        z-index: 10000;
    }
    
    .modal.active ~ .active-workout-banner,
    body:has(.modal.active) .active-workout-banner {
        display: none !important;
        visibility: hidden;
        opacity: 0;
    }
}
</style>

<script>
    function checkWorkoutExists(workoutId) {
        return fetch(`/api/check_workout/${workoutId}`)
            .then(response => response.json())
            .then(data => data.exists)
            .catch(() => false);
    }

    async function cleanupDeletedWorkouts() {
        const userIdElement = document.getElementById('userId');
        const currentUserId = userIdElement ? userIdElement.value : null;
        if (!currentUserId) return;
        
        const keysToRemove = [];
        
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(`workout_${currentUserId}_`) && key.endsWith('_active')) {
                const workoutId = key.replace(`workout_${currentUserId}_`, '').replace('_active', '');
                const exists = await checkWorkoutExists(workoutId);
                if (!exists) {
                    keysToRemove.push(`workout_${currentUserId}_${workoutId}_active`);
                    keysToRemove.push(`workout_${currentUserId}_${workoutId}`);
                    keysToRemove.push(`workout_${currentUserId}_${workoutId}_timer`);
                }
            }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
    }

    function waitForUserId() {
        return new Promise((resolve) => {
            if (document.getElementById('userId')) {
                resolve();
                return;
            }
            const observer = new MutationObserver(() => {
                if (document.getElementById('userId')) {
                    observer.disconnect();
                    resolve();
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });
    }

   async function updateActiveWorkoutBanner() {
    const banner = document.getElementById('activeWorkoutBanner');
    if (!banner) return;
    
    // ТОЛЬКО на странице активной тренировки скрываем баннер
    if (window.location.pathname.includes('/start') || 
        window.location.pathname.includes('/continue')) {
        banner.style.display = 'none';
        return;
    }
    
    // Добавляем небольшую задержку для стабильности
    await new Promise(resolve => setTimeout(resolve, 50));
    
    await waitForUserId();
    
    const workoutName = document.getElementById('activeWorkoutName');
    const workoutTimer = document.getElementById('activeWorkoutTimer');
    const continueBtn = document.getElementById('continueWorkoutBtn');
    
    const userIdElement = document.getElementById('userId');
    const currentUserId = userIdElement ? userIdElement.value : null;
    
    if (!currentUserId) {
        banner.style.display = 'none';
        return;
    }
    
    // Не ждём cleanupDeletedWorkouts при быстрых переходах
    // cleanupDeletedWorkouts().catch(console.error);
    
    let activeWorkoutId = null;
    let activeWorkoutData = null;
    
    // Проверяем localStorage синхронно (быстрее)
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(`workout_${currentUserId}_`) && key.endsWith('_active')) {
            const isActive = localStorage.getItem(key) === 'true';
            if (isActive) {
                activeWorkoutId = key.replace(`workout_${currentUserId}_`, '').replace('_active', '');
                const workoutData = localStorage.getItem(`workout_${currentUserId}_${activeWorkoutId}`);
                if (workoutData) {
                    try {
                        activeWorkoutData = JSON.parse(workoutData);
                    } catch(e) {
                        localStorage.removeItem(key);
                        activeWorkoutId = null;
                    }
                } else {
                    localStorage.removeItem(key);
                    activeWorkoutId = null;
                }
            }
            break;
        }
    }
    
    if (activeWorkoutId && activeWorkoutData) {
        const timerData = localStorage.getItem(`workout_${currentUserId}_${activeWorkoutId}_timer`);
        workoutName.textContent = activeWorkoutData.name || 'Активная тренировка';
        
        if (timerData) {
            const seconds = parseInt(timerData);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            workoutTimer.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        } else {
            workoutTimer.textContent = '00:00';
        }
        
        continueBtn.href = `/workout/${activeWorkoutId}/continue`;
        banner.style.display = 'block';
    } else {
        banner.style.display = 'none';
    }
}

    function observeSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            const observer = new MutationObserver(() => {
                const banner = document.getElementById('activeWorkoutBanner');
                if (banner) banner.style.transition = 'left 0.3s ease';
            });
            observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await waitForUserId();
        updateActiveWorkoutBanner();
        observeSidebar();
    });

    setInterval(updateActiveWorkoutBanner, 1000);
    window.addEventListener('pageshow', updateActiveWorkoutBanner);
    window.addEventListener('focus', updateActiveWorkoutBanner);
    // Принудительная проверка при загрузке страницы (без задержки)
document.addEventListener('DOMContentLoaded', () => {
    // Сразу проверяем
    setTimeout(() => {
        updateActiveWorkoutBanner();
    }, 100);
});

// Дополнительная проверка через 1 секунду после загрузки
window.addEventListener('load', () => {
    setTimeout(() => {
        updateActiveWorkoutBanner();
    }, 500);
});

// При переходах по ссылкам в SPA-стиле (если используешь)
document.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
        setTimeout(() => {
            updateActiveWorkoutBanner();
        }, 150);
    });
});
</script>
