<!DOCTYPE html>
<html>
<head>
    <!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <title>Добавить упражнение</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded {
            margin-left: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, var(--success), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gray {
            background: var(--gray);
            color: white;
        }

        .btn-gray:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-gray:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            width: 100%;
            justify-content: center;
            margin-top: 20px;
            padding: 15px;
            font-size: 1.1em;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-success:active {
            transform: scale(0.96);
        }

        .file-upload {
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
            background: var(--light);
        }

        .file-upload:hover {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .file-upload:active {
            transform: scale(0.98);
        }

        .file-upload i {
            font-size: 3em;
            color: var(--gray);
            margin-bottom: 10px;
        }

        .file-upload p {
            color: var(--gray);
            font-size: 1em;
            margin-bottom: 5px;
        }

        .file-upload .hint {
            font-size: 0.85em;
            color: var(--gray);
            opacity: 0.7;
        }

        .file-name {
            margin-top: 10px;
            padding: 8px;
            background: white;
            border-radius: 8px;
            color: var(--success);
            font-weight: 500;
            display: none;
        }

        .file-name.active {
            display: block;
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid var(--success);
            display: none;
        }

        .image-preview.active {
            display: block;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 500;
        }

        label i {
            color: var(--success);
            margin-right: 8px;
        }

        .required-star {
            color: var(--danger);
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 1.1em;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        input.valid {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        input.invalid {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .char-counter {
            text-align: right;
            font-size: 0.75em;
            color: var(--gray);
            margin-top: 5px;
        }

        .char-counter.warning {
            color: var(--warning);
        }

        .char-counter.danger {
            color: var(--danger);
        }

        .error-message {
            background: #fee2e2;
            color: var(--danger);
            padding: 15px 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 5px solid var(--danger);
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        .toast-notification.error {
            background: var(--danger);
        }

        .toast-notification.success {
            background: var(--success);
        }

        .toast-notification.warning {
            background: var(--warning);
            color: var(--dark);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ========================================
           МОБИЛЬНАЯ АДАПТАЦИЯ
           ======================================== */
        
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0 !important;
                padding: 20px 16px 80px 16px;
            }
            
            .container {
                padding: 24px 18px;
                border-radius: 20px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .header .btn-gray {
                width: 100%;
                justify-content: center;
                padding: 10px 16px;
            }
            
            .file-upload {
                padding: 20px;
            }
            
            .file-upload i {
                font-size: 2em;
            }
            
            .file-upload p {
                font-size: 0.9em;
            }
            
            input, select {
                padding: 12px 16px;
                font-size: 16px;
                border-radius: 14px;
            }
            
            .char-counter {
                font-size: 0.7em;
            }
            
            .btn-success {
                padding: 12px;
                font-size: 1em;
            }
            
            .image-preview {
                max-width: 120px;
                max-height: 120px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 15px 12px 80px 12px;
            }
            
            .container {
                padding: 20px 14px;
            }
            
            .header h1 {
                font-size: 1.3em;
            }
            
            input, select {
                padding: 11px 14px;
            }
        }

        /* Планшеты */
        @media (min-width: 768px) and (max-width: 1024px) {
            .main-content {
                margin-left: 80px !important;
                padding: 20px 24px;
            }
        }
    </style>
</head>
<body>
    <input type="hidden" id="userId" value="{{ session['user_id'] }}">
    {% include 'sidebar.html' %}
    
    <div class="main-content" id="mainContent">
        <div class="container">
            <div class="header">
                <h1><i class="fas fa-plus-circle"></i> Добавить упражнение</h1>
                <a href="{{ url_for('exercises_library') }}" class="btn btn-gray">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" id="exerciseForm">
                <!-- Красивая загрузка изображения -->
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Нажмите чтобы загрузить изображение</p>
                    <p class="hint">Поддерживаются JPG, PNG, GIF, WEBP</p>
                    <div class="file-name" id="fileName"></div>
                </div>
                
                <input type="file" id="imageInput" name="image" accept="image/*" style="display: none;" onchange="previewImage(this)">
                
                <div class="image-preview" id="imagePreview">
                    <img src="" alt="Превью">
                </div>

                <!-- Название упражнения -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-dumbbell"></i> Название упражнения
                        <span class="required-star">*</span>
                    </label>
                    <input type="text" 
                           name="name" 
                           id="exerciseName"
                           placeholder="Например: Жим штанги лежа"
                           minlength="2"
                           maxlength="20"
                           required
                           autofocus>
                    <div class="char-counter" id="charCounter">
                        <span id="charCount">0</span>/20
                    </div>
                </div>

                <!-- Группа мышц -->
                <div class="form-group">
                    <label><i class="fas fa-bolt"></i> Группа мышц *</label>
                    <select name="muscle_group" required>
                        <option value="">Выберите группу мышц</option>
                        <option value="Грудные">Грудные</option>
                        <option value="Спина">Спина</option>
                        <option value="Ноги">Ноги</option>
                        <option value="Плечи">Плечи</option>
                        <option value="Бицепс">Бицепс</option>
                        <option value="Трицепс">Трицепс</option>
                        <option value="Пресс">Пресс</option>
                        <option value="Ягодицы">Ягодицы</option>
                    </select>
                </div>
                
                <!-- Ссылка на видео -->
                <div class="form-group">
                    <label>
                        <i class="fab fa-youtube"></i> Видео-инструкция
                    </label>
                    <input type="url" 
                        name="video_url" 
                        id="videoUrl"
                        placeholder="https://www.youtube.com/watch?v=... или https://youtu.be/..."
                        value="{{ exercise.video_url if exercise else '' }}">
                    <div class="hint-text" style="font-size: 0.75em; color: var(--gray); margin-top: 5px;">
                        <i class="fas fa-info-circle"></i> Вставьте ссылку на YouTube видео с правильным выполнением упражнения
                    </div>
                </div>

                <button type="submit" class="btn btn-success" id="submitBtn">
                    <i class="fas fa-save"></i> Сохранить упражнение
                </button>
            </form>
        </div>
    </div>

    {% include 'active_workout_banner.html' %}

    <script>
        // Состояние сайдбара
        const mainContent = document.getElementById('mainContent');
        const savedState = localStorage.getItem('sidebar_collapsed');
        if (savedState === 'true') {
            mainContent.classList.add('expanded');
        }

        const exerciseNameInput = document.getElementById('exerciseName');
        const charCountSpan = document.getElementById('charCount');
        const charCounterDiv = document.querySelector('.char-counter');
        const form = document.getElementById('exerciseForm');

        function showToast(message, type = 'error') {
            const oldToast = document.querySelector('.toast-notification');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            let icon = type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : 
                       type === 'success' ? '<i class="fas fa-check-circle"></i>' : 
                       '<i class="fas fa-info-circle"></i>';
            toast.innerHTML = `${icon} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateCharCounter() {
            const length = exerciseNameInput.value.length;
            charCountSpan.textContent = length;
            
            if (length >= 18 && length < 20) {
                charCounterDiv.classList.add('warning');
                charCounterDiv.classList.remove('danger');
            } else if (length >= 20) {
                charCounterDiv.classList.add('danger');
                charCounterDiv.classList.remove('warning');
            } else {
                charCounterDiv.classList.remove('warning', 'danger');
            }
        }

        function validateField() {
            const value = exerciseNameInput.value.trim();
            
            if (value.length === 0) {
                exerciseNameInput.classList.remove('valid', 'invalid');
                return false;
            }
            
            if (value.length < 2) {
                exerciseNameInput.classList.add('invalid');
                exerciseNameInput.classList.remove('valid');
                return false;
            }
            
            if (value.length > 20) {
                exerciseNameInput.classList.add('invalid');
                exerciseNameInput.classList.remove('valid');
                return false;
            }
            
            exerciseNameInput.classList.add('valid');
            exerciseNameInput.classList.remove('invalid');
            return true;
        }

        function limitInput() {
            if (exerciseNameInput.value.length > 20) {
                exerciseNameInput.value = exerciseNameInput.value.slice(0, 20);
                updateCharCounter();
                showToast('Максимум 20 символов', 'warning');
            }
        }

        form.addEventListener('submit', function(e) {
            const value = exerciseNameInput.value.trim();
            
            if (value === '') {
                e.preventDefault();
                showToast('Введите название упражнения', 'error');
                exerciseNameInput.classList.add('invalid');
                exerciseNameInput.focus();
                return false;
            }
            
            if (value.length < 2) {
                e.preventDefault();
                showToast('Название должно содержать минимум 2 символа', 'error');
                exerciseNameInput.classList.add('invalid');
                exerciseNameInput.focus();
                return false;
            }
            
            if (value.length > 20) {
                e.preventDefault();
                showToast('Название не может превышать 20 символов', 'error');
                exerciseNameInput.classList.add('invalid');
                exerciseNameInput.focus();
                return false;
            }
            
            showToast('Упражнение добавляется...', 'success');
        });

        exerciseNameInput.addEventListener('input', function() {
            updateCharCounter();
            validateField();
            limitInput();
        });
        
        exerciseNameInput.addEventListener('blur', function() {
            validateField();
        });

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            const fileName = document.getElementById('fileName');
            const previewImg = preview.querySelector('img');
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                fileName.textContent = file.name;
                fileName.classList.add('active');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    preview.classList.add('active');
                }
                reader.readAsDataURL(file);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCharCounter();
            validateField();
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('✅ Service Worker зарегистрирован!', reg.scope);
      }).catch(function(err) {
        console.log('❌ Ошибка регистрации SW:', err);
      });
    });
  }
</script>
</body>
</html>
