<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <title>Редактировать тренировку</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded {
            margin-left: 80px;
        }

        .content-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, var(--warning), #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Кнопки */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gray {
            background: var(--gray);
            color: white;
        }

        .btn-gray:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #fbbf24);
            color: var(--dark);
            padding: 12px 24px;
            font-size: 1em;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        /* Форма */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 500;
            font-size: 1em;
        }

        label i {
            color: var(--warning);
            margin-right: 8px;
        }

        .required-star {
            color: var(--danger);
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 1.1em;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--warning);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        input::placeholder {
            color: #aaa;
            font-size: 0.95em;
        }

        /* Стили для валидного/невалидного поля */
        input.valid {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        input.invalid {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Счётчик символов */
        .char-counter {
            text-align: right;
            font-size: 0.75em;
            color: var(--gray);
            margin-top: 5px;
        }

        .char-counter.warning {
            color: var(--warning);
        }

        .char-counter.danger {
            color: var(--danger);
        }

        .workout-info {
            background: var(--light);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 0.95em;
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .workout-info i {
            color: var(--warning);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group .btn {
            flex: 1;
            justify-content: center;
        }

        /* Всплывающее уведомление */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        .toast-notification.error {
            background: var(--danger);
        }

        .toast-notification.success {
            background: var(--success);
        }

        .toast-notification.warning {
            background: var(--warning);
            color: var(--dark);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ========================================
           МОБИЛЬНАЯ АДАПТАЦИЯ
           ======================================== */
        
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0 !important;
                padding: 20px 16px 80px 16px;
            }
            
            .content-container {
                padding: 24px 18px;
                border-radius: 20px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .header .btn-gray {
                width: 100%;
                justify-content: center;
                padding: 10px 16px;
            }
            
            .workout-info {
                font-size: 0.85em;
                padding: 12px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            label {
                font-size: 0.9em;
            }
            
            input {
                padding: 12px 16px;
                font-size: 16px;
                border-radius: 14px;
            }
            
            .char-counter {
                font-size: 0.7em;
            }
            
            .button-group {
                flex-direction: column;
                gap: 12px;
            }
            
            .btn-warning {
                padding: 12px 20px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 15px 12px 80px 12px;
            }
            
            .content-container {
                padding: 20px 14px;
            }
            
            .header h1 {
                font-size: 1.3em;
            }
            
            .workout-info {
                font-size: 0.8em;
                padding: 10px;
            }
            
            input {
                padding: 11px 14px;
            }
        }

        /* Планшеты */
        @media (min-width: 768px) and (max-width: 1024px) {
            .main-content {
                margin-left: 80px !important;
                padding: 20px 24px;
            }
        }
    </style>
</head>
<body>
    <input type="hidden" id="userId" value="{{ session['user_id'] }}">
    {% include 'sidebar.html' %}
    
    <div class="main-content" id="mainContent">
        <div class="content-container">
            <div class="header">
                <h1><i class="fas fa-edit"></i> Редактировать тренировку</h1>
                <a href="{{ url_for('view_workout', workout_id=workout.id) }}" class="btn btn-gray">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>

            <!-- Информация о дате -->
            <div class="workout-info">
                <i class="fas fa-calendar"></i>
                <span>Тренировка от {{ workout.date }}</span>
            </div>

            <form method="post" id="editWorkoutForm">
                <div class="form-group">
                    <label>
                        <i class="fas fa-dumbbell"></i> Название тренировки
                        <span class="required-star">*</span>
                    </label>
                    <input type="text" 
                           name="name" 
                           id="workoutName"
                           value="{{ workout.name }}"
                           placeholder="Например: Тренировка груди"
                           minlength="1"
                           maxlength="200"
                           required
                           autofocus>
                    <div class="char-counter" id="charCounter">
                        <span id="charCount">{{ workout.name|length }}</span>/20
                    </div>
                </div>

                <div class="button-group">
                    <a href="{{ url_for('view_workout', workout_id=workout.id) }}" class="btn btn-gray">
                        Отмена
                    </a>
                    <button type="submit" class="btn btn-warning" id="submitBtn">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    {% include 'active_workout_banner.html' %}

    <script>
        // Состояние сайдбара
        const mainContent = document.getElementById('mainContent');
        const savedState = localStorage.getItem('sidebar_collapsed');
        if (savedState === 'true') {
            mainContent.classList.add('expanded');
        }

        // Элементы
        const workoutNameInput = document.getElementById('workoutName');
        const charCountSpan = document.getElementById('charCount');
        const charCounterDiv = document.querySelector('.char-counter');
        const form = document.getElementById('editWorkoutForm');

        // Функция показа уведомления
        function showToast(message, type = 'error') {
            const oldToast = document.querySelector('.toast-notification');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            
            let icon = '';
            if (type === 'error') icon = '<i class="fas fa-exclamation-circle"></i>';
            if (type === 'success') icon = '<i class="fas fa-check-circle"></i>';
            if (type === 'warning') icon = '<i class="fas fa-info-circle"></i>';
            
            toast.innerHTML = `${icon} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Обновление счётчика символов
        function updateCharCounter() {
            const length = workoutNameInput.value.length;
            charCountSpan.textContent = length;
            
            if (length >= 15 && length < 20) {
                charCounterDiv.classList.add('warning');
                charCounterDiv.classList.remove('danger');
            } else if (length >= 20) {
                charCounterDiv.classList.add('danger');
                charCounterDiv.classList.remove('warning');
            } else {
                charCounterDiv.classList.remove('warning', 'danger');
            }
        }

        // Валидация поля (только проверка на пустоту и длину)
        function validateField() {
            const value = workoutNameInput.value.trim();
            
            if (value.length === 0) {
                workoutNameInput.classList.remove('valid', 'invalid');
                return false;
            }
            
            if (value.length > 20) {
                workoutNameInput.classList.add('invalid');
                workoutNameInput.classList.remove('valid');
                return false;
            }
            
            workoutNameInput.classList.add('valid');
            workoutNameInput.classList.remove('invalid');
            return true;
        }

        // Ограничение на ввод (максимум 20 символов)
        function limitInput() {
            if (workoutNameInput.value.length > 20) {
                workoutNameInput.value = workoutNameInput.value.slice(0, 20);
                updateCharCounter();
                showToast('Максимум 20 символов', 'warning');
            }
        }

        // Обработка отправки формы
        form.addEventListener('submit', function(e) {
            const value = workoutNameInput.value.trim();
            
            // Проверка на пустое поле
            if (value === '') {
                e.preventDefault();
                showToast('Пожалуйста, введите название тренировки', 'error');
                workoutNameInput.classList.add('invalid');
                workoutNameInput.focus();
                return false;
            }
            
            // Проверка на максимальную длину
            if (value.length > 20) {
                e.preventDefault();
                showToast('Название не может превышать 20 символов', 'error');
                workoutNameInput.classList.add('invalid');
                workoutNameInput.focus();
                return false;
            }
            
            // Всё хорошо
            showToast('Изменения сохранены!', 'success');
        });

        // События
        workoutNameInput.addEventListener('input', function() {
            updateCharCounter();
            validateField();
            limitInput();
        });
        
        workoutNameInput.addEventListener('blur', function() {
            validateField();
        });
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            updateCharCounter();
            validateField();
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('✅ Service Worker зарегистрирован!', reg.scope);
      }).catch(function(err) {
        console.log('❌ Ошибка регистрации SW:', err);
      });
    });
  }
</script>
</body>
</html>
